# Tokens visuais da locadora. Chaves com [light] ou [dark] valem so no tema correspondente.

[light]@accentColor = #2f6fed
[dark]@accentColor = #5b8def
Button.default.foreground = #ffffff

Component.arc = 10
Button.arc = 10
TextComponent.arc = 10
CheckBox.arc = 6
Component.focusWidth = 1
Component.innerFocusWidth = 0

ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.width = 10

Table.rowHeight = 34
Table.showHorizontalLines = true
Table.showVerticalLines = false
Table.intercellSpacing = 0,1
Table.cellMargins = 2,8,2,8
TableHeader.height = 34
TableHeader.cellMargins = 2,12,2,12
TableHeader.separatorColor = $TableHeader.background
TableHeader.bottomSeparatorColor = $Component.borderColor

[light]Locadora.fundo = #f7f8fa
[dark]Locadora.fundo = #1e1f22
[light]Locadora.barraLateral = #eef0f4
[dark]Locadora.barraLateral = #18191b
[light]Locadora.cartao = #ffffff
[dark]Locadora.cartao = #2a2c30
[light]Locadora.selecao = #dfe8fd
[dark]Locadora.selecao = #2c3b5c
[light]Locadora.suave = #6b7280
[dark]Locadora.suave = #9aa0aa

[light]Locadora.perigo = #c93a3a
[dark]Locadora.perigo = #ff7a7a
[light]Locadora.perigoFundo = #fdeeee
[dark]Locadora.perigoFundo = #3d2526
[light]Locadora.sucesso = #23864b
[dark]Locadora.sucesso = #5ad08f
[light]Locadora.aviso = #b06d00
[dark]Locadora.aviso = #f2b84b
[light]Locadora.toast = #1f2937
[dark]Locadora.toast = #f3f4f6
[light]Locadora.toastTexto = #f9fafb
[dark]Locadora.toastTexto = #111827
